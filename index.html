    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="GoGoGirl" />

      property="og:description"
      content="App personal de productividad: Hoy, categorías y semana."

      href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('gogogirl-theme')
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.dataset.theme = theme
          }
          if (theme === 'dark') {
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#17141c')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
